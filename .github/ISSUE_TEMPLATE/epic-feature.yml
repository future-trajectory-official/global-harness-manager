name: Epic/Feature作成
description: EpicまたはFeatureを新規作成
labels:
  - type:Epic
body:
  - type: dropdown
    id: hierarchy_level
    attributes:
      label: 階層レベル
      description: "作成するIssueの階層レベルを選択してください。"
      options:
        - Epic
        - Feature
    validations:
      required: true
  - type: input
    id: id
    attributes:
      label: ID
      description: "Epic/Featureの識別子。他のIssueから参照する際に使用します。"
      placeholder: "ManagementFoundation"
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: 名前
      description: "Epic/Featureの簡潔な名前。"
      placeholder: "ProjectGovernance"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: "このEpic/Featureが解決する課題や提供する価値を簡潔に記述してください。"
      placeholder: "GitHub Projects / Issues と連携し、複数人開発を見据えたプロジェクト管理の分離とガバナンス体制を構築する。"
    validations:
      required: true
  - type: textarea
    id: current_spec
    attributes:
      label: 現在の仕様
      description: "現在の仕様を記述してください。設計決定の背景やトレードオフも含めてください。"
      placeholder: "- サブIssue機能を使用して親子関係を表現\n- Project V2のカスタムフィールドで属性を管理"
    validations:
      required: false
  - type: textarea
    id: change_history
    attributes:
      label: 変更履歴
      description: "仕様変更の履歴を記述してください。日付、変更内容、理由を含めてください。"
      placeholder: "- 2026-06-18: 初期仕様策定\n- 2026-06-20: sub-issues機能からbody記述に変更（理由: ...）"
    validations:
      required: false
